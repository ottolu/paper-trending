llm:
  # DeepSeek official V4 Pro (OpenAI-compatible). Thinking is default-on and
  # toggled via the `thinking` object — NOT SiliconFlow's enable_thinking /
  # thinking_budget. Thinking mode also rejects temperature/top_p (see LLMClient).
  base_url: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-v4-pro"
  prompt_version: "analysis_v1"
  enable_thinking: true
  thinking_budget: 32768  # SiliconFlow-only; ignored by DeepSeek

embedding:
  base_url: "https://api.siliconflow.cn/v1"
  api_key: "${SILICONFLOW_API_KEY}"
  model: "Qwen/Qwen3-Embedding-8B"

obsidian:
  vault_path: "./obsidian"

storage:
  data_root: "./data"
  paper_root: "./data/papers"

pdf:
  download_timeout_seconds: 120
  max_file_size_mb: 100
  # pymupdf: fast path (~0.5s/paper), font-size-based heading heuristic.
  # Alternative: "marker" for precise table/equation reconstruction or scanned PDFs.
  parser_name: "pymupdf"
  parser_version: "v1"
  keep_raw_pdf: true

arxiv:
  categories: ["cs.CL", "cs.AI", "cs.LG"]
  request_interval_seconds: 3

scheduler:
  collector_cron: "0 2 * * *"
  reporter_cron: "0 9 * * 1"
